<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="wc-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path
    d="M32 4 L56 12 V32 C56 46 45 56 32 60 C19 56 8 46 8 32 V12 Z"
    fill="url(#wc-grad)"
  />

  <!-- Watch bezel outer ring -->
  <circle cx="32" cy="30" r="16" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.95"/>

  <!-- 12 hour tick marks -->
  <g stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9">
    <line x1="32" y1="16" x2="32" y2="19"/>
    <line x1="39" y1="17.9" x2="37.5" y2="20.5"/>
    <line x1="44.1" y1="23" x2="41.5" y2="24.5"/>
    <line x1="46" y1="30" x2="43" y2="30"/>
    <line x1="44.1" y1="37" x2="41.5" y2="35.5"/>
    <line x1="39" y1="42.1" x2="37.5" y2="39.5"/>
    <line x1="32" y1="44" x2="32" y2="41"/>
    <line x1="25" y1="42.1" x2="26.5" y2="39.5"/>
    <line x1="19.9" y1="37" x2="22.5" y2="35.5"/>
    <line x1="18" y1="30" x2="21" y2="30"/>
    <line x1="19.9" y1="23" x2="22.5" y2="24.5"/>
    <line x1="25" y1="17.9" x2="26.5" y2="20.5"/>
  </g>

  <!-- Clock hands pointing to 12 and 3 (operational / "on watch") -->
  <g stroke="white" stroke-width="2.2" stroke-linecap="round">
    <line x1="32" y1="30" x2="32" y2="21"/>
    <line x1="32" y1="30" x2="39" y2="30"/>
  </g>

  <!-- Center dot -->
  <circle cx="32" cy="30" r="1.8" fill="white"/>
</svg>
